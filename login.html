<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Throttle &amp; Steel</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous"/>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <a href="index.html" class="brand-mark">THROTTLE<span>&amp;STEEL</span></a>
        <h2>Login</h2>
        <form onsubmit="return false;">
          <input type="email" class="form-control" placeholder="Email Address" required />
          <input type="password" class="form-control" placeholder="Password" required />
          <button type="submit" class="custom-button"><span>Login</span></button>
        </form>
        <p class="auth-switch">Don't have an account? <a href="sign-up.html">Sign up here</a></p>
      </div>
    </div>
  </body>
</html>
